name: warehouse_poc
description: "Warehouse Management System - Proof of Concept (Flutter port of the React/Vite POC)."
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  csv: ^6.0.0
  image_picker: ^1.1.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/material_serial_mappings.csv
